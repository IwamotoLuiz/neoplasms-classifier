<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Antes da primeira pintura, para a tela não piscar no tema errado.
      // O escuro é o padrão; o claro só aparece se a pessoa escolheu antes.
      (function () {
        var saved = null
        try { saved = localStorage.getItem('theme') } catch (error) { /* armazenamento bloqueado */ }
        document.documentElement.dataset.theme = saved === 'light' ? 'light' : 'dark'
      })()
    </script>
    <title>Classificação de neoplasmas cutâneos</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
